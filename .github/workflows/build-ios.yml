name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14 # Using macOS 14 runner for Xcode 15 support

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'any'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build iOS (No Codesign)
        run: |
          cd mobile
          flutter build ios --no-codesign --release

      - name: Package IPA
        run: |
          mkdir -p build_ipa/Payload
          cp -r mobile/build/ios/iphoneos/Runner.app build_ipa/Payload/
          cd build_ipa
          zip -r app.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build_ipa/app.ipa
