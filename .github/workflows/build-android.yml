name: Build Android APK

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Flutter stable channel
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Set up Java (required for Gradle)
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '11'

      # Decode keystore from secret (base64 encoded)
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p mobile/android/app
          echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/app/safe_route_key.jks

      # Create key.properties file with secret values
      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: safe_route_key
        run: |
          cat <<EOF > mobile/android/key.properties
          storeFile=../app/safe_route_key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Get Flutter dependencies
      - name: Get dependencies
        run: |
          cd mobile
          flutter pub get

      # Build release APK (signed with keystore)
      - name: Build release APK
        run: |
          cd mobile
          flutter build apk --release

      # Optional: Build debug APK for quick testing
      - name: Build debug APK
        run: |
          cd mobile
          flutter build apk --debug

      # Upload the release APK as artifact
      - name: Upload release APK
        uses: actions/upload-artifact@v3
        with:
          name: android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      # Upload the debug APK as artifact (optional)
      - name: Upload debug APK
        uses: actions/upload-artifact@v3
        with:
          name: android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
